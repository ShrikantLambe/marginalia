name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm test
      # NOTE: `next build` is intentionally NOT run here. Build-time page-data
      # collection instantiates Stack Auth, which validates NEXT_PUBLIC_STACK_
      # PROJECT_ID as a real UUID — a hermetic CI run has no valid credentials.
      # Vercel builds with the real env on every push, so it is the build gate;
      # CI covers the checks Vercel doesn't (typecheck, lint, tests).
